name: Translate Chinese docs with Hermes

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum number of documents
        required: true
        default: '5'

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    # This runner must have an authenticated Hermes CLI. No OAuth token or API
    # key is stored in the repository.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Translate queued documents
        env:
          BRANCH: automation/translate-zh-hans
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$BRANCH" "${{ github.event.repository.default_branch }}"
          python3 website/scripts/zh_docs.py translate --limit '${{ inputs.limit }}'
          python3 website/scripts/zh_docs.py refresh
          python3 website/scripts/zh_docs.py queue >/dev/null
          python3 website/scripts/zh_docs.py validate
          git add website/i18n/zh-Hans website/translation
          git diff --cached --quiet || git commit -m 'docs: update zh-Hans translations'

      - name: Build Chinese docs
        working-directory: website
        run: |
          npm ci
          npm run build -- --locale zh-Hans

      - name: Push translation branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/translate-zh-hans
        run: |
          git push --force-with-lease origin "$BRANCH"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title 'docs: 更新 Hermes 简体中文翻译（待人工审核）'
          else
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title 'docs: 更新 Hermes 简体中文翻译（待人工审核）' \
              --body '由 Hermes 生成或更新中文译文。AI 输出为 draft，合并前必须人工逐篇核对，并使用 zh_docs.py mark 标记审核人。'
          fi
